services:
  fuzzitts:
    build: .
    image: fuzzitts
    container_name: fuzzitts
    restart: unless-stopped
    ports:
      # Change ONLY the host side to avoid clashes, e.g. HOST_PORT=8085.
      # The container always listens on 8080 (matched by the env + healthcheck).
      - "${HOST_PORT:-8080}:8080"
    environment:
      # Service config (see README). Values here override the image defaults.
      # Leave PORT at 8080 — it must match the container side of the mapping
      # above and the healthcheck below. To publish elsewhere, set HOST_PORT.
      PORT: "8080"
      PIPER_MODEL_DIR: "/app/models"
      MAX_TEXT: "${MAX_TEXT:-1000}"
      # PIPER_BIN: "piper"
      # FFMPEG_BIN: "ffmpeg"
    # By default, the bundled en_US-amy voice baked into the image is used,
    # so `docker compose up` works with no extra setup.
    #
    # To manage voices from the host instead, uncomment the bind mount below.
    # NOTE: a bind mount SHADOWS the image's baked-in models, so you must first
    # populate ./models yourself with piper's downloader (a raw curl from HF
    # returns an LFS pointer, not the real model):
    #   pip install piper-tts
    #   python -m piper.download_voices en_US-amy-low --download-dir ./models
    # Then add any extra voices (e.g. ... en_US-ryan-high) and a matching
    # entry in the VOICES map in server.js.
    # volumes:
    #   - ./models:/app/models
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
